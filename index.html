<title>People Analytics</title>
<style>
  /* Layout: Power-BI-style report with top band, page tabs, global slicers and chart grids. Omexom brand tokens. */
  :root{
    --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa;
    --ink:#182230; --muted:#5b6670; --faint:#8a94a0;
    --grid:#e7ebef; --border:#e1e6ea;
    --brand:#0071ce; --brand-deep:#005ca8; --cyan:#00a7c6; --amber:#e39a00;
    --good:#1c8a57; --good-bg:#e3f3ea; --warn:#b07d00; --warn-bg:#fcf0d4; --risk:#c5362c; --risk-bg:#fbe6e3;
    --band:#0071ce; --band-ink:#ffffff; --band-sub:#cfe6fb;
    --shadow:0 1px 2px rgba(16,38,60,.06),0 2px 10px rgba(16,38,60,.05);
    --r:10px; --f:"Arial","Helvetica Neue",Helvetica,system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e141b; --surface:#161e27; --surface-2:#121922;
    --ink:#e8edf2; --muted:#9aa6b2; --faint:#73808d;
    --grid:#243039; --border:#263340;
    --brand:#2e9be6; --brand-deep:#5bb4ef; --cyan:#35c6e0; --amber:#ffc23f;
    --band:#0b2740; --band-ink:#ffffff; --band-sub:#bcd6ef;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e141b; --surface:#161e27; --surface-2:#121922;
    --ink:#e8edf2; --muted:#9aa6b2; --faint:#73808d;
    --grid:#243039; --border:#263340;
    --brand:#2e9be6; --brand-deep:#5bb4ef; --cyan:#35c6e0; --amber:#ffc23f;
    --band:#0b2740; --band-ink:#ffffff; --band-sub:#bcd6ef;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 28px}
  .band{background:var(--band);color:var(--band-ink);border-radius:0 0 14px 14px;padding:16px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .mark{font-weight:700;letter-spacing:.14em;font-size:20px}
  .band h1{font-size:15px;font-weight:700;margin:0;line-height:1.2}
  .band .sub{color:var(--band-sub);font-size:12px;margin-top:2px}
  .band .spacer{flex:1 1 40px}
  .badge{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.04em}
  .tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .tbtn:hover{background:rgba(255,255,255,.26)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 2px;border-bottom:2px solid var(--border)}
  .tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;padding:9px 14px;font-family:var(--f);font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0}
  .tab:hover{color:var(--ink);background:var(--surface-2)}
  .tab[aria-selected="true"]{color:var(--brand-deep);border-bottom-color:var(--brand)}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .slicers{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:14px 0 2px}
  .slicer{display:flex;flex-direction:column;gap:4px}
  .slicer label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .slicer select,.chip{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;font-family:var(--f);min-width:170px;box-shadow:var(--shadow)}
  .chip{display:inline-flex;align-items:center;min-width:0;font-weight:600}
  .slicer select:focus-visible,.tbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
  .kpi .k-l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .kpi .k-v{font-size:26px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .k-d{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .kpi .k-s{font-size:11px;color:var(--faint);margin-top:3px}
  .up-good,.down-good{color:var(--good)} .up-bad,.down-bad{color:var(--risk)} .flat{color:var(--muted)}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;margin-top:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--shadow);min-width:0;margin-top:12px}
  .card h2{font-size:13px;margin:0 0 2px;font-weight:700}
  .card .h-sub{font-size:11px;color:var(--faint);margin:0 0 8px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:2px 0 6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .ax{fill:var(--muted);font-size:11px} .vlab{fill:var(--ink);font-size:11px;font-weight:700}
  .gl{stroke:var(--grid);stroke-width:1}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
  th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-risk{background:var(--risk-bg);color:var(--risk)}
  .note{font-size:11px;color:var(--faint);margin-top:16px;line-height:1.5}
  #tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:7px;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;white-space:nowrap}
  #tip .t2{font-weight:400;opacity:.85}
  .hit{fill:transparent;cursor:crosshair}
  .bar{cursor:default}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)} .grid,.grid2{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="band">
  <span class="mark">OMEXOM</span>
  <div><h1>People Analytics</h1><div class="sub" id="bandsub">Regional HR dashboards</div></div>
  <span class="spacer"></span>
  <span class="badge">Illustrative sample data</span>
  <button class="tbtn" id="theme" type="button" aria-label="Toggle light or dark theme">Dark</button>
</div>

<div class="wrap">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="slicers">
    <div class="slicer"><label for="region">Region</label><select id="region"></select></div>
    <div class="slicer"><label for="dept">Department</label><select id="dept"></select></div>
    <div class="slicer"><label for="role">Job role</label><select id="role"></select></div>
    <div class="slicer"><label>Period</label><span class="chip">12 months to Sep 2026</span></div>
  </div>
  <div id="page"></div>
  <p class="note" id="foot"></p>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s);};
  var tip=$("#tip");
  function showTip(html,x,y){tip.innerHTML=html;tip.style.opacity="1";var w=tip.offsetWidth,h=tip.offsetHeight;var px=x+14;if(px+w>innerWidth-8)px=x-w-14;var py=y-h-10;if(py<8)py=y+18;tip.style.left=px+"px";tip.style.top=py+"px";}
  function hideTip(){tip.style.opacity="0";}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function nf(n){return Number(n).toLocaleString("en-GB");}
  var MON=["Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep"];

  /* ---------- chart primitives ---------- */
  function lineChart(id,series,o){
    o=o||{};var W=720,H=290,L=44,R=16,T=14,B=28,pw=W-L-R,ph=H-T-B;
    var yMax=o.yMax||5,n=series.length,labels=o.labels||MON,unit=o.unit||"%",tks=o.ticks||5;
    var X=function(i){return L+pw*i/(n-1);},Y=function(v){return T+ph*(1-v/yMax);};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart">';
    for(var t=0;t<=tks;t++){var v=yMax*t/tks,y=Y(v);s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="ax" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+(yMax>=100?Math.round(v):v.toFixed(0))+unit+'</text>';}
    for(var i=0;i<n;i+=(n>8?2:1)){s+='<text class="ax" x="'+X(i)+'" y="'+(H-9)+'" text-anchor="middle">'+labels[i]+'</text>';}
    if(o.target!=null){var ty=Y(o.target);s+='<line x1="'+L+'" y1="'+ty+'" x2="'+(W-R)+'" y2="'+ty+'" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 5"/><text class="ax" x="'+(L+4)+'" y="'+(ty-6)+'" text-anchor="start" style="fill:var(--amber);font-weight:700">Target '+o.target+unit+'</text>';}
    var dp="",ar="M"+X(0)+" "+(T+ph);
    for(var j=0;j<n;j++){dp+=(j?"L":"M")+X(j)+" "+Y(series[j])+" ";ar+="L"+X(j)+" "+Y(series[j])+" ";}
    ar+="L"+X(n-1)+" "+(T+ph)+" Z";
    s+='<path d="'+ar+'" fill="var(--brand)" opacity="0.08"/><path d="'+dp+'" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    for(var k=0;k<n;k++)s+='<circle cx="'+X(k)+'" cy="'+Y(series[k])+'" r="'+(k===n-1?4.5:3)+'" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"/>';
    s+='<text x="'+X(n-1)+'" y="'+(Y(series[n-1])-12)+'" text-anchor="end" class="vlab" style="fill:var(--brand-deep)">'+series[n-1]+unit+'</text>';
    s+='<line class="cx" x1="0" y1="'+T+'" x2="0" y2="'+(T+ph)+'" stroke="var(--brand)" stroke-width="1" opacity="0"/>';
    var step=pw/(n-1);
    for(var h=0;h<n;h++)s+='<rect class="hit" x="'+(X(h)-step/2)+'" y="'+T+'" width="'+step+'" height="'+ph+'" data-i="'+h+'"/>';
    s+='</svg>';
    var el=$("#"+id);el.innerHTML=s;
    var svg=$("svg",el),cx=$(".cx",el);
    el.querySelectorAll(".hit").forEach(function(r){
      r.addEventListener("mousemove",function(){var i=+r.getAttribute("data-i"),bb=svg.getBoundingClientRect(),sc=bb.width/W;
        cx.setAttribute("x1",X(i));cx.setAttribute("x2",X(i));cx.setAttribute("opacity","1");
        showTip(labels[i]+'<br><span class="t2">'+(o.name||"Value")+' '+series[i]+unit+(o.target!=null?' · target '+o.target+unit:"")+'</span>',bb.left+X(i)*sc,bb.top+Y(series[i])*sc);});
      r.addEventListener("mouseleave",function(){cx.setAttribute("opacity","0");hideTip();});
    });
  }
  function hbars(id,items,o){
    o=o||{};var W=360,rowH=32,padT=6,L=o.labelW||104,R=46,pw=W-L-R,H=padT+items.length*rowH+6;
    var max=o.max||Math.max.apply(null,items.map(function(x){return x[1];})),unit=o.unit||"";
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart">';
    if(o.target!=null){var tx=L+pw*o.target/max;s+='<line x1="'+tx+'" y1="'+padT+'" x2="'+tx+'" y2="'+(H-6)+'" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 4"/>';}
    items.forEach(function(it,i){var y=padT+i*rowH,bw=Math.max(pw*it[1]/max,2),over=o.target!=null&&(o.lowerBetter?it[1]>o.target:it[1]<o.target);
      s+='<text class="ax" x="'+(L-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end">'+esc(it[0])+'</text>';
      s+='<rect x="'+L+'" y="'+(y+5)+'" width="'+bw+'" height="'+(rowH-12)+'" rx="4" fill="var(--brand)" class="bar" data-l="'+esc(it[0])+'" data-v="'+it[1]+unit+'"/>';
      s+='<text x="'+(L+bw+6)+'" y="'+(y+rowH/2+4)+'" class="vlab" '+(over?'style="fill:var(--risk)"':'')+'>'+it[1]+unit+(over?' ▼':'')+'</text>';});
    s+='</svg>';var el=$("#"+id);el.innerHTML=s;wireMarks(el);
  }
  function stacked(id,rows,o){
    o=o||{};var W=360,H=240,L=36,R=10,T=10,B=26,pw=W-L-R,ph=H-T-B;
    var tot=rows.map(function(r){return r[1]+r[2];}),max=Math.ceil(Math.max.apply(null,tot)/(o.step||200))*(o.step||200);
    var n=rows.length,bw=Math.min(52,pw/n*0.6),gap=(pw-bw*n)/(n+1),Y=function(v){return T+ph*(1-v/max);};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Stacked columns">';
    for(var t=0;t<=4;t++){var v=max*t/4,y=Y(v);s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+'</text>';}
    rows.forEach(function(r,i){var x=L+gap+i*(bw+gap),sh=ph*r[1]/max,lo=ph*r[2]/max,yb=T+ph;
      s+='<rect x="'+x+'" y="'+(yb-sh)+'" width="'+bw+'" height="'+sh+'" rx="3" fill="var(--brand)" class="bar" data-l="'+r[0]+' '+(o.a||"A")+'" data-v="'+r[1]+(o.unit||"")+'"/>';
      s+='<rect x="'+x+'" y="'+(yb-sh-lo-2)+'" width="'+bw+'" height="'+lo+'" rx="3" fill="var(--cyan)" class="bar" data-l="'+r[0]+' '+(o.b||"B")+'" data-v="'+r[2]+(o.unit||"")+'"/>';
      s+='<text class="ax" x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+r[0]+'</text>';
      s+='<text class="vlab" x="'+(x+bw/2)+'" y="'+(yb-sh-lo-8)+'" text-anchor="middle" style="font-size:10px">'+(r[1]+r[2])+'</text>';});
    s+='</svg>';var el=$("#"+id);el.innerHTML=s;wireMarks(el);
  }
  function groupedCols(id,rows,o){
    o=o||{};var W=360,H=240,L=34,R=10,T=16,B=26,pw=W-L-R,ph=H-T-B;
    var max=o.max||Math.ceil(Math.max.apply(null,rows.map(function(r){return Math.max(r[1],r[2]);}))/10)*10;
    var n=rows.length,grp=pw/n,bw=Math.min(20,grp*0.32),Y=function(v){return T+ph*(1-v/max);};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grouped columns">';
    for(var t=0;t<=4;t++){var v=max*t/4,y=Y(v);s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+'</text>';}
    rows.forEach(function(r,i){var cx=L+grp*i+grp/2,yb=T+ph;var ha=ph*r[1]/max,hb=ph*r[2]/max;
      s+='<rect x="'+(cx-bw-1)+'" y="'+(yb-ha)+'" width="'+bw+'" height="'+ha+'" rx="3" fill="var(--brand)" class="bar" data-l="'+r[0]+' '+(o.a||"A")+'" data-v="'+r[1]+'"/>';
      s+='<rect x="'+(cx+1)+'" y="'+(yb-hb)+'" width="'+bw+'" height="'+hb+'" rx="3" fill="var(--cyan)" class="bar" data-l="'+r[0]+' '+(o.b||"B")+'" data-v="'+r[2]+'"/>';
      s+='<text x="'+(cx-bw/2-1)+'" y="'+(yb-ha-4)+'" text-anchor="middle" class="vlab" style="font-size:9px">'+r[1]+'</text>';
      s+='<text x="'+(cx+bw/2+1)+'" y="'+(yb-hb-4)+'" text-anchor="middle" class="vlab" style="font-size:9px;fill:var(--brand-deep)">'+r[2]+'</text>';
      s+='<text class="ax" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+r[0]+'</text>';});
    s+='</svg>';var el=$("#"+id);el.innerHTML=s;wireMarks(el);
  }
  function deptBars(id,items,o){
    o=o||{};var W=720,rowH=26,padT=6,L=200,R=54,pw=W-L-R,H=padT+items.length*rowH+6;
    var max=Math.max.apply(null,items.map(function(x){return x.value;})),unit=o.unit||"";
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="By department bar chart">';
    if(o.target!=null){var tx=L+pw*o.target/max;s+='<line x1="'+tx+'" y1="'+padT+'" x2="'+tx+'" y2="'+(H-6)+'" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 4"/>';}
    items.forEach(function(it,i){var y=padT+i*rowH,bw=Math.max(pw*it.value/max,2);var fill=it.group==="Corporate"?"var(--cyan)":"var(--brand)";
      var fade=(o.highlight&&o.highlight!=="all"&&o.highlight!==it.id)?' opacity="0.35"':'';
      s+='<text class="ax" x="'+(L-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end">'+esc(it.label)+'</text>';
      s+='<rect class="bar" x="'+L+'" y="'+(y+4)+'" width="'+bw+'" height="'+(rowH-10)+'" rx="4" fill="'+fill+'"'+fade+' data-l="'+esc(it.label)+'" data-v="'+it.value+unit+'"/>';
      s+='<text x="'+(L+bw+6)+'" y="'+(y+rowH/2+4)+'" class="vlab">'+it.value+unit+'</text>';});
    s+='</svg>';var el=$("#"+id);el.innerHTML=s;wireMarks(el);
  }
  function wireMarks(el){el.querySelectorAll(".bar").forEach(function(m){
    m.addEventListener("mousemove",function(e){showTip(esc(m.getAttribute("data-l"))+'<br><span class="t2">'+esc(m.getAttribute("data-v"))+'</span>',e.clientX,e.clientY);});
    m.addEventListener("mouseleave",hideTip);});}

  /* ---------- builders ---------- */
  function kpiHTML(arr){return '<div class="kpis">'+arr.map(function(k){
    var cls=k.good?(k.dir==="down"?"down-good":"up-good"):(k.dir==="down"?"down-bad":"up-bad");if(k.dir==="flat")cls="flat";
    var a=k.dir==="down"?"▼":k.dir==="up"?"▲":"▬";
    return '<div class="kpi"><div class="k-l">'+esc(k.l)+'</div><div class="k-v">'+esc(k.v)+'</div><div class="k-d '+cls+'">'+a+' '+esc(k.d)+'</div><div class="k-s">'+esc(k.s)+'</div></div>';
  }).join("")+'</div>';}
  function card(title,sub,id,legend){return '<div class="card"><h2>'+title+'</h2><p class="h-sub">'+sub+'</p>'+(legend||"")+'<div id="'+id+'"></div></div>';}
  function tableCard(title,sub,head,rows){return '<div class="card"><h2>'+title+'</h2><p class="h-sub">'+sub+'</p><div style="overflow-x:auto"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';}
  function leg(a,b){return '<div class="legend"><span><i style="background:var(--brand)"></i>'+a+'</span><span><i style="background:var(--cyan)"></i>'+b+'</span></div>';}
  function deptCard(title,sub){return '<div class="card"><h2>'+title+'</h2><p class="h-sub">'+sub+'</p><div class="legend"><span><i style="background:var(--brand)"></i>Delivery</span><span><i style="background:var(--cyan)"></i>Corporate</span></div><div id="c_byd"></div><p class="h-sub" id="deptfocus" style="margin-top:8px"></p></div>';}

  /* ---------- regions & departments ---------- */
  var REGIONS=[
    {id:"all",name:"All UK & Ireland",share:1,absF:1,attF:1,compD:0,sites:null},
    {id:"sco",name:"Scotland",share:0.214,absF:1.08,attF:1.05,compD:-3,sites:["Inverness","Aberdeen","Glasgow","Edinburgh","Dundee"]},
    {id:"nor",name:"North of England",share:0.154,absF:0.98,attF:1.00,compD:-1,sites:["Newcastle","Leeds","Manchester","Sheffield","Hull"]},
    {id:"mid",name:"Midlands & East",share:0.188,absF:0.95,attF:0.97,compD:1,sites:["Birmingham","Leicester","Nottingham","Coventry","Derby","Peterborough"]},
    {id:"lon",name:"London & South East",share:0.145,absF:0.97,attF:1.05,compD:2,sites:["London","Reading","Crawley","Maidstone","Chelmsford"]},

  /* ---------- helpers ---------- */
  function r1(v){return Math.round(v*10)/10;}
  function money(v){return v>=1e6?('£'+(Math.round(v/1e5)/10)+'m'):('£'+Math.round(v/1000)+'k');}
  function hf(s,lo,hi){var h=0,i;for(i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return lo+(h%997)/997*(hi-lo);}
  function scaleArr(a,f){return a.map(function(x){return [x[0],Math.max(1,Math.round(x[1]*f))];});}
  function scaleFlow(a,f){return a.map(function(x){return [x[0],Math.max(0,Math.round(x[1]*f)),Math.max(0,Math.round(x[2]*f))];});}
  function distribute(total,names){var w=names.map(function(n){return hf(n,0.6,1.4);}),s=w.reduce(function(a,b){return a+b;},0);return names.map(function(n,i){return [n,Math.max(1,Math.round(total*w[i]/s))];});}
  function distRate(rate,names){return names.map(function(n){return [n,r1(rate*hf(n,0.82,1.18))];});}
  function distComp(base,names){return names.map(function(n){return [n,Math.max(60,Math.min(100,Math.round(base+(hf(n,0,4)-2))))];});}
  function apportion(total,shares){var raw=shares.map(function(x){return total*x[1];}),fl=raw.map(Math.floor),used=fl.reduce(function(a,b){return a+b;},0),rem=total-used;var ord=raw.map(function(v,i){return [i,v-fl[i]];}).sort(function(a,b){return b[1]-a[1];});for(var k=0;k<rem;k++){fl[ord[k%ord.length][0]]++;}return shares.map(function(x,i){return [x[0],fl[i]];});}
  function regAgg(page,id){var r=reg(id);
    if(page==="absence")return r1(BASE.absence.rate*r.absF);
    if(page==="er")return Math.round(BASE.er.open*r.share);
    if(page==="hc")return Math.round(BASE.hc.head*r.share);
    return Math.min(100,BASE.train.overall+r.compD);}

  function genAbsCases(names,total){
    var d=distribute(total,names).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
    var stages=["Capability","OH referral","Welfare","Formal","Welfare","OH referral"];
    return d.map(function(x,i){var code=i===0?"risk":(i<3?"warn":"good");var lab=i===0?"At risk":(i<3?"Watch":"On track");return [x[0],x[1],Math.max(6,34-i*5),stages[i%stages.length],code,lab];});
  }
  function genERcases(names,aged,trib){
    var n=Math.min(aged,6),rows=[],types=["Grievance","Long-term sickness","Disciplinary","Capability","Grievance","Disciplinary"];
    var ts=Math.min(trib,n);
    for(var j=0;j<n;j++){var isRisk=j<ts,ageD=isRisk?90+(ts-1-j)*8:Math.max(61,86-(j-ts)*6);var code=isRisk?"risk":"warn",lab=isRisk?"At risk":"Watch";rows.push(["ER-"+(204+j),names[j%names.length],types[j%types.length],ageD,code,lab]);}
    return rows;
  }
  function genHCtable(names,head,attr){
    var hcs=distribute(head,names).sort(function(a,b){return b[1]-a[1];});
    return hcs.map(function(x){var at=r1(attr*hf(x[0],0.9,1.12));var code=at>=16?"risk":(at>=14?"warn":"good");var lab=at>=16?"High":(at>=14?"Watch":"Stable");return [x[0],x[1],at+"%",code,lab];});
  }

    else {agg=regAgg("er",id);var sw=DEPTS.reduce(function(a,d){return a+d.w*d.er;},0);items=DEPTS.map(function(d){return {id:d.id,label:d.name,group:d.group,value:Math.max(1,Math.round(agg*d.w*d.er/sw))};});}

    var dep=DEPTS.filter(function(x){return x.id===state.dept;})[0];
    rsel.innerHTML='<option value="all">All roles in '+esc(dep.name)+'</option>'+dep.roles.map(function(r){return '<option value="'+esc(r[0])+'">'+esc(r[0])+'</option>';}).join("");
    if(!dep.roles.some(function(r){return r[0]===state.role;}))state.role="all";
    rsel.value=state.role;
  }
  function draw(){var p=PAGES.filter(function(x){return x.id===cur;})[0];
    $("#bandsub").textContent=p.sub;p.fn(buildPage(p.id,$("#region").value));
    $("#foot").textContent="Illustrative sample data built to demonstrate dashboard design across the HR areas this role covers. These are not Omexom figures. Region, Department and Job role slicers and the page tabs are live; hover any chart for detail. Built in Omexom brand colours (primary #0071CE).";}
  $("#tabs").innerHTML=PAGES.map(function(p){return '<button class="tab" role="tab" data-id="'+p.id+'" aria-selected="'+(p.id===cur)+'">'+p.name+'</button>';}).join("");
  $("#tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;cur=b.getAttribute("data-id");
    $("#tabs").querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",t===b);});draw();});
  var rs=$("#region");
  rs.innerHTML=REGIONS.map(function(r){return '<option value="'+r.id+'">'+esc(r.name)+'</option>';}).join("");
  rs.addEventListener("change",draw);
  var ds=$("#dept");
  ds.innerHTML='<option value="all">All departments</option>'+DEPTS.map(function(d){return '<option value="'+d.id+'">'+esc(d.name)+'</option>';}).join("");
  ds.addEventListener("change",function(){state.dept=this.value;state.role="all";populateRoles();draw();});
  $("#role").addEventListener("change",function(){state.role=this.value;draw();});
  populateRoles();
  var tb=$("#theme");
  function applyTheme(t){document.documentElement.setAttribute("data-theme",t);tb.textContent=t==="dark"?"Light":"Dark";}
  var saved;try{saved=localStorage.getItem("omx-theme");}catch(e){}if(saved)applyTheme(saved);
  tb.addEventListener("click",function(){var c=document.documentElement.getAttribute("data-theme");
    var nx=c==="dark"?"light":(c==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
    applyTheme(nx);try{localStorage.setItem("omx-theme",nx);}catch(e){}draw();});
  draw();
})();
</script>
