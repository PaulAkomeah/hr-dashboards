<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Paul Akomeah">
<title>People Analytics</title>
<style>
  /* Layout: report with top band, page tabs, global slicers and chart grids. */
  :root{
    --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa;
    --ink:#182230; --muted:#5b6670; --faint:#6f7985;
    --grid:#e7ebef; --border:#e1e6ea;
    --brand:#0071ce; --brand-deep:#005ca8; --cyan:#00a7c6; --amber:#e39a00;
    --good:#1c8a57; --good-bg:#e3f3ea; --warn:#8f6500; --warn-bg:#fcf0d4; --risk:#c5362c; --risk-bg:#fbe6e3;
    --band:#0071ce; --band-ink:#ffffff; --band-sub:#dcecfb;
    --shadow:0 1px 2px rgba(16,38,60,.06),0 2px 10px rgba(16,38,60,.05);
    --r:10px; --f:"Arial","Helvetica Neue",Helvetica,system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e141b; --surface:#161e27; --surface-2:#121922;
    --ink:#e8edf2; --muted:#9aa6b2; --faint:#8793a0;
    --grid:#243039; --border:#263340;
    --brand:#2e9be6; --brand-deep:#5bb4ef; --cyan:#35c6e0; --amber:#ffc23f;
    --good:#4cc38a; --good-bg:#143326; --warn:#f0c04a; --warn-bg:#3a2f10; --risk:#ff8278; --risk-bg:#3d1b18;
    --band:#0b2740; --band-ink:#ffffff; --band-sub:#bcd6ef;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e141b; --surface:#161e27; --surface-2:#121922;
    --ink:#e8edf2; --muted:#9aa6b2; --faint:#8793a0;
    --grid:#243039; --border:#263340;
    --brand:#2e9be6; --brand-deep:#5bb4ef; --cyan:#35c6e0; --amber:#ffc23f;
    --good:#4cc38a; --good-bg:#143326; --warn:#f0c04a; --warn-bg:#3a2f10; --risk:#ff8278; --risk-bg:#3d1b18;
    --band:#0b2740; --band-ink:#ffffff; --band-sub:#bcd6ef;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 28px}
  .band{background:var(--band);color:var(--band-ink);border-radius:0 0 14px 14px;padding:14px 20px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
  .mark{font-weight:700;letter-spacing:.14em;font-size:20px}
  .band h1{font-size:15px;font-weight:700;margin:0;line-height:1.2}
  .band .sub{color:var(--band-sub);font-size:12px;margin-top:2px}
  .band .spacer{flex:1 1 20px}
  .badge{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.04em}
  .tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--f);text-decoration:none;display:inline-block}
  .tbtn:hover{background:rgba(255,255,255,.26)}
  .tbtn[aria-current="page"]{background:#fff;color:#005ca8;border-color:#fff}
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .by{font-size:12px;color:var(--muted);margin:10px 2px 0}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 2px;border-bottom:2px solid var(--border)}
  .tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;padding:9px 14px;font-family:var(--f);font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0}
  .tab:hover{color:var(--ink);background:var(--surface-2)}
  .tab[aria-selected="true"]{color:var(--brand-deep);border-bottom-color:var(--brand)}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .slicers{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:14px 0 2px}
  .slicer{display:flex;flex-direction:column;gap:4px;flex:0 1 auto}
  .slicer label,.slicer .lab{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .slicer select,.chip{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;font-family:var(--f);min-width:170px;max-width:100%;box-shadow:var(--shadow)}
  .chip{display:inline-flex;align-items:center;min-width:0;font-weight:600}
  .slicer select:focus-visible,.tbtn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .linkbtn{background:none;border:none;color:var(--brand-deep);font-family:var(--f);font-size:12px;font-weight:700;cursor:pointer;padding:9px 4px;text-decoration:underline}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0}
  .kpis.six{grid-template-columns:repeat(6,1fr)}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
  .kpi.s-good::before{background:var(--good)} .kpi.s-warn::before{background:var(--amber)} .kpi.s-risk::before{background:var(--risk)}
  .kpi .k-l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .kpi .k-v{font-size:26px;font-weight:700;margin:4px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .k-d{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .kpi .k-s{font-size:11px;color:var(--faint);margin-top:4px}
  .c-good{color:var(--good)} .c-risk{color:var(--risk)} .c-flat{color:var(--muted)}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--shadow);min-width:0;margin-top:12px}
  .card h2{font-size:13px;margin:0 0 2px;font-weight:700}
  .card .h-sub{font-size:11px;color:var(--faint);margin:0 0 8px}
  .insight{border-left:4px solid var(--brand);padding:14px 18px}
  .insight h2{font-size:15px;margin-bottom:6px}
  .insight p{margin:0 0 8px;font-size:13.5px;max-width:92ch}
  .insight h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
  .insight ul,.insight ol{margin:0 0 4px;padding-left:18px;max-width:92ch}
  .sumcols{display:grid;grid-template-columns:1.35fr 1fr;gap:4px 36px}
  @media (max-width:900px){.sumcols{grid-template-columns:1fr}}
  .insight li{margin:0 0 5px;font-size:13.5px}
  .insight .how{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:9px;margin:12px 0 2px}
  .prose p,.prose li{font-size:13.5px;max-width:86ch}
  .prose p{margin:0 0 8px}
  .prose ul,.prose ol{margin:0 0 6px;padding-left:18px}
  .prose li{margin:0 0 6px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:2px 0 6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .ax{fill:var(--muted);font-size:11px} .vlab{fill:var(--ink);font-size:11px;font-weight:700}
  .gl{stroke:var(--grid);stroke-width:1}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
  th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.sel td{background:var(--surface-2);font-weight:700}
  tr.tot td{font-weight:700;border-top:2px solid var(--border)}
  tr.pickrow{cursor:pointer} tr.pickrow:hover td{background:var(--surface-2)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-risk{background:var(--risk-bg);color:var(--risk)}
  .note{font-size:11.5px;color:var(--faint);margin-top:16px;line-height:1.55}
  #tip{position:fixed;pointer-events:none;z-index:50;background:#182230;color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;transition:opacity .08s;max-width:min(320px,calc(100vw - 16px));line-height:1.4;left:0;top:0}
  #tip .t2{font-weight:400}
  #tip .tl{font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;margin:7px 0 2px;color:#bcd6ef}
  #tip ol{margin:0;padding-left:16px;font-weight:400}
  #tip .tf{font-weight:400;font-size:11px;color:#bcd6ef;margin-top:5px}
  .hit{fill:transparent;cursor:crosshair}
  .bar{cursor:pointer}
  @media (max-width:1000px){.kpis.six{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)} .kpis.six{grid-template-columns:repeat(2,1fr)} .grid,.grid2,.cols2{grid-template-columns:1fr} .grid>.card,.grid2>.card,.cols2>.card{margin-top:0} .grid,.grid2,.cols2{margin-top:12px}}
  @media (min-width:901px){.grid>.card,.grid2>.card,.cols2>.card{margin-top:12px}}
  @media (max-width:560px){.slicer{flex:1 1 100%} .slicer select{width:100%} .band{padding:12px 14px} .kpi .k-v{font-size:22px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    body{background:#fff;font-size:12px} .tabs,.slicers,#theme,.nav,#tip,.how{display:none!important}
    .band{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .card,.kpi{box-shadow:none;break-inside:avoid} .pill,.kpi::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .wrap{max-width:none;padding:0 6px}
  }
</style>
</head>
<body>
<div class="band">
  <span class="mark">OMEXOM</span>
  <div><h1>People Analytics</h1><div class="sub" id="bandsub">Regional HR dashboards</div></div>
  <span class="spacer"></span>
  <nav class="nav" aria-label="Dashboards">
    <a class="tbtn" href="index.html" aria-current="page">People Analytics</a>
    <a class="tbtn" href="workforce.html">Workforce Explorer</a>
  </nav>
  <span class="badge">Illustrative sample data</span>
  <button class="tbtn" id="theme" type="button" aria-label="Toggle light or dark theme">Dark</button>
</div>

<div class="wrap">
  <p class="by">Prepared by Paul Akomeah MCIPD for interview discussion. Every figure and every name here is invented sample data. None of it is Omexom data.</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="slicers" id="slicers">
    <div class="slicer"><label for="region">Region</label><select id="region"></select></div>
    <div class="slicer"><label for="dept">Department</label><select id="dept"></select></div>
    <div class="slicer"><label for="role">Job role</label><select id="role"></select></div>
    <div class="slicer"><span class="lab">Period</span><span class="chip">12 months to Sep 2026</span></div>
    <button class="linkbtn" id="reset" type="button" hidden>Clear filters</button>
  </div>
  <div id="page"></div>
  <p class="note" id="foot"></p>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script>
/* ---------- shared sample data model (identical on both pages) ---------- */
var M=(function(){
  "use strict";
  function hf(s,lo,hi){var h=0,i;for(i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return lo+(h%997)/997*(hi-lo);}
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry(20261016);
  function pick(arr,w){var s=0,i;for(i=0;i<w.length;i++)s+=w[i];var x=rnd()*s;for(i=0;i<arr.length;i++){x-=w[i];if(x<0)return arr[i];}return arr[arr.length-1];}
  function alloc(total,w){var s=0,i;for(i=0;i<w.length;i++)s+=w[i];var out=[],fr=[],used=0;
    for(i=0;i<w.length;i++){var raw=s>0?total*w[i]/s:0,f=Math.floor(raw);out.push(f);fr.push([i,raw-f]);used+=f;}
    fr.sort(function(a,b){return b[1]-a[1]||a[0]-b[0];});
    for(i=0;i<total-used;i++)out[fr[i%fr.length][0]]++;
    return out;}
  function sample(total,w){var out=w.map(function(){return 0;}),idx=w.map(function(x,i){return i;});for(var i=0;i<total;i++)out[pick(idx,w)]++;return out;}

  var WORKDAYS=228,COST_PER_DAY=140,BASE_HC=850;
  var REGIONS=[
    {id:"sco",name:"Scotland",scale:1.25,absF:1.08,attF:1.05,compD:-3,tthF:1.08,sites:["Inverness","Aberdeen","Glasgow","Edinburgh","Dundee"]},
    {id:"nor",name:"North of England",scale:0.90,absF:0.98,attF:1.00,compD:-1,tthF:1.00,sites:["Newcastle","Leeds","Manchester","Sheffield","Hull"]},
    {id:"mid",name:"Midlands & East",scale:1.10,absF:0.95,attF:0.97,compD:1,tthF:0.96,sites:["Birmingham","Leicester","Nottingham","Coventry","Derby","Peterborough"]},
    {id:"lon",name:"London & South East",scale:0.85,absF:0.97,attF:1.05,compD:2,tthF:1.06,sites:["London","Reading","Crawley","Maidstone","Chelmsford"]},
    {id:"wal",name:"Wales & West",scale:0.80,absF:1.00,attF:0.98,compD:0,tthF:0.98,sites:["Cardiff","Bristol","Swansea","Gloucester","Exeter"]},
    {id:"irl",name:"Ireland",scale:0.95,absF:1.02,attF:0.95,compD:1,tthF:0.95,sites:["Belfast","Dublin","Cork","Galway","Limerick"]}
  ];
  var DEPTS=[
    {id:"con",name:"Construction & Site",short:"Construction",group:"Delivery",w:0.28,abs:1.5,att:1.15,comp:-4,er:1.4,tth:0.95,roles:[["Construction Manager",2],["Site Manager",4],["Civils Site Engineer",6],["Overhead Linesperson",10],["Cable Jointer",7],["Substation Fitter",7]]},
    {id:"pm",name:"Project Management",short:"Project Mgmt",group:"Delivery",w:0.15,abs:0.8,att:0.95,comp:1,er:0.8,tth:1.05,roles:[["Project Director",1],["Senior Project Manager",3],["Project Manager",6],["Project Engineer",7],["Graduate Project Manager",3]]},
    {id:"eng",name:"Engineering & Design",short:"Engineering",group:"Delivery",w:0.13,abs:0.7,att:0.90,comp:1,er:0.7,tth:1.25,roles:[["Design Manager",1],["Senior Design Engineer",3],["Design Engineer",6],["Protection & Control Engineer",3],["CAD Technician",3]]},
    {id:"com",name:"Commercial & Estimating",short:"Commercial",group:"Delivery",w:0.08,abs:0.8,att:1.00,comp:0,er:0.8,tth:1.10,roles:[["Commercial Manager",1],["Senior Quantity Surveyor",2],["Quantity Surveyor",4],["Estimator",3],["Bid Manager",1]]},
    {id:"cmg",name:"Commissioning & Testing",short:"Commissioning",group:"Delivery",w:0.07,abs:1.3,att:1.05,comp:-2,er:1.1,tth:1.15,roles:[["Commissioning Manager",1],["Commissioning Engineer",4],["Test Technician",4]]},
    {id:"shq",name:"SHEQ",short:"SHEQ",group:"Delivery",w:0.06,abs:1.1,att:0.90,comp:3,er:0.9,tth:1.00,roles:[["SHEQ Manager",1],["Health & Safety Advisor",4],["Environmental Advisor",2],["Quality Engineer",2]]},
    {id:"fin",name:"Finance",short:"Finance",group:"Corporate",w:0.06,abs:0.75,att:0.85,comp:3,er:0.7,tth:0.90,roles:[["Finance Director",1],["Financial Controller",1],["Management Accountant",3],["Accounts Assistant",4],["Payroll Officer",2]]},
    {id:"hr",name:"HR / People",short:"HR / People",group:"Corporate",w:0.05,abs:0.8,att:0.85,comp:4,er:0.8,tth:0.85,roles:[["Head of HR",1],["Regional HR Manager",1],["HR Business Partner",3],["HR Advisor",4],["L&D Advisor",2]]},
    {id:"pro",name:"Procurement & Supply Chain",short:"Procurement",group:"Corporate",w:0.045,abs:0.85,att:0.95,comp:1,er:0.85,tth:0.90,roles:[["Procurement Manager",1],["Buyer",4],["Supply Chain Coordinator",3]]},
    {id:"it",name:"IT & Digital",short:"IT & Digital",group:"Corporate",w:0.04,abs:0.7,att:1.05,comp:2,er:0.7,tth:1.00,roles:[["IT Manager",1],["IT Support Technician",4],["Data / BI Analyst",2]]},
    {id:"mkt",name:"Marketing & Communications",short:"Marketing",group:"Corporate",w:0.035,abs:0.75,att:1.00,comp:2,er:0.75,tth:0.90,roles:[["Marketing Manager",1],["Communications Officer",2],["Digital Marketing Executive",2],["Bid Writer",2]]}
  ];
  var RMAP={},DMAP={};REGIONS.forEach(function(r){RMAP[r.id]=r;});DEPTS.forEach(function(d){DMAP[d.id]=d;});

  /* invented names: none of these are real colleagues */
  var FIRST=["Moira","Tomasz","Dervla","Callum","Priya","Gethin","Aoife","Marek","Shona","Kwame","Elin","Ruairi","Farah","Angus","Bronagh","Dawid","Nia","Fergus","Sunita","Iestyn","Orla","Lachlan","Zainab","Hywel","Catriona","Piotr","Niamh","Hamish","Amara","Rhodri","Sinead","Greig","Leila","Owain","Mhairi","Kofi","Eira","Declan","Yasmin","Struan","Carys","Emeka","Fionnuala","Ivo"];
  var LAST=["Kessock","Brylka","Quillan","Tarbert","Vasani","Penhallow","Corrigle","Stanek","Abernyte","Oduya","Trevethan","Mullarney","Zaheer","Balcomie","Fennick","Wojtas","Pencarrow","Dunlossit","Radia","Aberdaron","Kilbride","Strathnaver","Okonjo","Llanrhos","Garvock","Halloran","Ostrowe","Tregear","Ballantrae","Musoke","Inverarity","Carnduff","Hesketh","Polglaze","Drumlin","Achebe","Skerray","Maddocks","Lisburne","Kowalczyk","Fintry","Rosemullion","Tullis","Egerton","Bavidge","Nethercote"];

  /* headcount cells: region x department x role */
  var CELLS=[];
  REGIONS.forEach(function(r){var rb=Math.round(r.scale*BASE_HC);
    DEPTS.forEach(function(d){var s=d.roles.reduce(function(a,x){return a+x[1];},0);
      d.roles.forEach(function(role){CELLS.push({r:r.id,d:d.id,role:role[0],hc:Math.max(1,Math.round(rb*d.w*role[1]/s)),people:[]});});});});
  var TOTAL=CELLS.reduce(function(a,c){return a+c.hc;},0);
  function siteW(r){return r.sites.map(function(s){return hf(s,0.6,1.4);});}

  /* colleagues */
  var PEOPLE=[];
  CELLS.forEach(function(c,ci){var r=RMAP[c.r],sw=siteW(r);
    for(var i=0;i<c.hc;i++){var u=rnd(),ten=u<0.14?rnd():Math.min(38,1-Math.log(1-rnd())*5.9);
      var p={ci:ci,name:FIRST[Math.floor(rnd()*FIRST.length)]+" "+LAST[Math.floor(rnd()*LAST.length)],site:pick(r.sites,sw),role:c.role,tenure:ten};
      c.people.push(p);PEOPLE.push(p);}});

  var QTR=["Oct-Dec","Jan-Mar","Apr-Jun","Jul-Sep"];
  var MONS=["Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep"];
  function startQ(p){var m=Math.min(11,Math.floor(p.tenure*12));return 3-Math.floor(m/3);}
  function startMon(p){var m=Math.min(11,Math.floor(p.tenure*12));return MONS[11-m];}

  /* weights */
  var wAbs=CELLS.map(function(c){return c.hc*RMAP[c.r].absF*DMAP[c.d].abs;});
  var wEr=CELLS.map(function(c){return c.hc*DMAP[c.d].er;});
  var wAtt=CELLS.map(function(c){return c.hc*RMAP[c.r].attF*DMAP[c.d].att;});
  var LEVEL=CELLS.map(function(c){return Math.max(60,Math.min(100,90+RMAP[c.r].compD+DMAP[c.d].comp+hf(c.role,-1,1)));});
  var wTr=CELLS.map(function(c,i){return c.hc*(100-LEVEL[i]);});
  var TTH=CELLS.map(function(c){return 46*RMAP[c.r].tthF*DMAP[c.d].tth;});

  /* absence */
  var ABS_SPLIT=[["Oct-Dec",6300,4000],["Jan-Mar",5900,3800],["Apr-Jun",5650,3700],["Jul-Sep",5400,3600]];
  var ABS_TREND=[4.6,4.5,4.4,4.2,4.1,4.0,3.9,3.8,3.7,3.6,3.5,3.4];
  var ABS_REASON=[["Minor illness",24],["Musculoskeletal",20],["Mental health",16],["Long-term other",16],["Stress / anxiety",13],["Surgery / hospital",11]];
  var cShort=ABS_SPLIT.map(function(q){return alloc(q[1],wAbs);}),cLong=ABS_SPLIT.map(function(q){return alloc(q[2],wAbs);});
  var cTrig=sample(83,wAbs);
  var LTS=[];
  sample(61,wAbs).forEach(function(n,ci){var r=RMAP[CELLS[ci].r],sw=siteW(r);
    for(var i=0;i<n;i++){var wk=Math.min(46,4+Math.floor(-Math.log(1-rnd())*11));
      LTS.push({ci:ci,site:pick(r.sites,sw),role:CELLS[ci].role,weeks:wk,
        stage:wk<8?"Welfare meeting":(wk<16?"OH referral":(wk<26?"Formal review":"Capability")),
        code:wk>=26?"risk":(wk>=13?"warn":"good"),label:wk>=26?"At risk":(wk>=13?"Watch":"On track")});}});
  LTS.sort(function(a,b){return b.weeks-a.weeks;});LTS.forEach(function(x,i){x.ref="LTS-"+(101+i);});

  /* employee relations */
  var ER_TYPE=[["Disciplinary",38],["Long-term sickness",29],["Grievance",26],["Capability",21],["Flexible working",14],["Other",10]];
  var ER_BANDS=[["0-14 days",0.355,1,14],["15-30 days",0.285,15,30],["31-60 days",0.19,31,60],["61-90 days",0.10,61,90],["90+ days",0.07,91,128]];
  var ER_FLOW=[["Apr",28,24],["May",26,27],["Jun",24,26],["Jul",25,28],["Aug",22,27],["Sep",23,28]];
  var ER=[];
  (function(){var per=sample(138,wEr),bandN=alloc(138,ER_BANDS.map(function(b){return b[1];})),bag=[];
    bandN.forEach(function(n,b){for(var i=0;i<n;i++)bag.push(b);});
    for(var i=bag.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),t=bag[i];bag[i]=bag[j];bag[j]=t;}
    var k=0;per.forEach(function(n,ci){var r=RMAP[CELLS[ci].r],sw=siteW(r);
      for(var i=0;i<n;i++){var b=ER_BANDS[bag[k++]];
        ER.push({ci:ci,site:pick(r.sites,sw),role:CELLS[ci].role,band:b[0],age:b[2]+Math.floor(rnd()*(b[3]-b[2]+1)),
          type:pick(ER_TYPE.map(function(x){return x[0];}),ER_TYPE.map(function(x){return x[1];}))});}});
    ER.sort(function(a,b){return b.age-a.age;});ER.forEach(function(x,i){x.ref="ER-"+(2301+i);});})();
  var cOpened=ER_FLOW.map(function(m,k){return alloc(m[1],wEr.map(function(w,i){return w*hf("o"+k+"_"+i,0.6,1.4);}));});
  var cClosed=ER_FLOW.map(function(m,k){return alloc(m[2],wEr.map(function(w,i){return w*hf("c"+k+"_"+i,0.6,1.4);}));});
  var cResolved=sample(16,wEr);

  /* leavers */
  var HC_TREND=[17.8,17.5,17.1,16.8,16.5,16.2,15.9,15.7,15.5,15.3,15.2,15.1];
  var HC_REASON=[["Career progression",24],["Better pay",23],["Relocation",15],["Work-life balance",12],["End of contract",11],["Retirement",8],["Other",7]];
  var VOLUNTARY={"Career progression":1,"Better pay":1,"Relocation":1,"Work-life balance":1,"Other":1};
  var LEAVERS=[];
  alloc(Math.round(TOTAL*0.151),wAtt).forEach(function(n,ci){var r=RMAP[CELLS[ci].r],sw=siteW(r);
    for(var i=0;i<n;i++){var fy=rnd()<0.27,reason=pick(HC_REASON.map(function(x){return x[0];}),HC_REASON.map(function(x){return x[1];}));
      if(fy&&reason==="Retirement")reason="Better pay";
      LEAVERS.push({ci:ci,site:pick(r.sites,sw),role:CELLS[ci].role,reason:reason,q:pick([0,1,2,3],[23,25,27,25]),fy:fy});}});

  /* training */
  var TR_TREND=[83,84,85,86,87,87,88,88,89,89,90,90];
  var COURSES=[
    {name:"Site Safety Induction",off:8,w:24,corp:false},
    {name:"Fire Safety",off:6,w:32,corp:true},
    {name:"Manual Handling",off:4,w:56,corp:true},
    {name:"GDPR / Data",off:2,w:78,corp:true},
    {name:"First Aid",off:-1,w:104,corp:true},
    {name:"Working at Height",off:-4,w:168,corp:false},
    {name:"HV / LV Awareness",off:-7,w:150,corp:false}];
  var OVERDUE=[];
  alloc(612,wTr).forEach(function(n,ci){var c=CELLS[ci],corp=DMAP[c.d].group==="Corporate";
    var cs=COURSES.filter(function(x){return !corp||x.corp;});
    for(var i=0;i<n;i++){var p=c.people[Math.floor(rnd()*c.people.length)];
      OVERDUE.push({ci:ci,site:p.site,role:c.role,name:p.name,course:pick(cs,cs.map(function(x){return x.w;})).name,days:Math.min(210,1+Math.floor(-Math.log(1-rnd())*42))});}});
  var cExpiring=alloc(840,CELLS.map(function(c,i){return c.hc*hf("e"+i,0.6,1.4);}));

  /* ---------- selection helpers ---------- */
  function inSel(c,s){return (s.region==="all"||c.r===s.region)&&(s.dept==="all"||c.d===s.dept)&&(s.role==="all"||c.role===s.role);}
  function mask(s){return CELLS.map(function(c){return inSel(c,s);});}
  function sumC(arr,mk){var t=0;for(var i=0;i<arr.length;i++)if(mk[i])t+=arr[i];return t;}
  function recs(list,mk){return list.filter(function(x){return mk[x.ci];});}
  function locOf(x,s){return s.region==="all"?RMAP[CELLS[x.ci].r].name:x.site;}
  function locs(s){return s.region==="all"?REGIONS.map(function(r){return r.name;}):RMAP[s.region].sites.slice();}
  function sub(s,k,v){var o={region:s.region,dept:s.dept,role:s.role};o[k]=v;return o;}
  var HCARR=CELLS.map(function(c){return c.hc;});

  function metrics(s){
    var mk=mask(s),head=sumC(HCARR,mk),o={head:head,mask:mk};
    o.split=ABS_SPLIT.map(function(q,k){return [q[0],sumC(cShort[k],mk),sumC(cLong[k],mk)];});
    o.days=o.split.reduce(function(a,q){return a+q[1]+q[2];},0);
    o.absRate=head?o.days/(head*WORKDAYS)*100:0;o.daysPer=head?o.days/head:0;o.cost=o.days*COST_PER_DAY;
    o.lts=recs(LTS,mk);o.lt26=o.lts.filter(function(x){return x.weeks>=26;}).length;o.trig=sumC(cTrig,mk);
    o.er=recs(ER,mk);o.erOpen=o.er.length;
    o.erAged=o.er.filter(function(x){return x.age>60;}).length;o.erTrib=o.er.filter(function(x){return x.age>90;}).length;
    o.erAvg=o.erOpen?o.er.reduce(function(a,x){return a+x.age;},0)/o.erOpen:0;
    o.resolved=sumC(cResolved,mk);
    o.flow=ER_FLOW.map(function(m,k){return [m[0],sumC(cOpened[k],mk),sumC(cClosed[k],mk)];});
    o.leavers=recs(LEAVERS,mk);o.attr=head?o.leavers.length/head*100:0;
    o.vol=head?o.leavers.filter(function(x){return VOLUNTARY[x.reason];}).length/head*100:0;
    o.people=PEOPLE.filter(function(p){return mk[p.ci];});
    o.starters=o.people.filter(function(p){return p.tenure<1;});
    var fyL=o.leavers.filter(function(x){return x.fy;}).length;
    o.fy=(o.starters.length+fyL)?fyL/(o.starters.length+fyL)*100:0;
    o.tenure=head?o.people.reduce(function(a,p){return a+p.tenure;},0)/head:0;
    var tw=0,lw=0;CELLS.forEach(function(c,i){if(mk[i]){tw+=c.hc*TTH[i];lw+=c.hc*LEVEL[i];}});
    o.tth=head?tw/head:0;o.comp=head?lw/head:0;
    o.fully=Math.max(40,Math.min(100,74+(o.comp-90)*1.5));
    o.overdue=recs(OVERDUE,mk);o.expiring=sumC(cExpiring,mk);
    return o;
  }

  return {hf:hf,REGIONS:REGIONS,DEPTS:DEPTS,RMAP:RMAP,DMAP:DMAP,CELLS:CELLS,TOTAL:TOTAL,PEOPLE:PEOPLE,QTR:QTR,MONS:MONS,
    ABS_TREND:ABS_TREND,ABS_REASON:ABS_REASON,ER_TYPE:ER_TYPE,ER_BANDS:ER_BANDS,HC_TREND:HC_TREND,HC_REASON:HC_REASON,
    TR_TREND:TR_TREND,COURSES:COURSES,cShort:cShort,cLong:cLong,cOpened:cOpened,cClosed:cClosed,
    metrics:metrics,mask:mask,sumC:sumC,locOf:locOf,locs:locs,sub:sub,startQ:startQ,startMon:startMon,alloc:alloc};
})();

</script>
<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s);};
  var tip=$("#tip"),tipOn=false;
  function showTip(html,x,y){tip.innerHTML=html;tip.style.opacity="1";tipOn=true;var w=tip.offsetWidth,h=tip.offsetHeight;var px=x+14;if(px+w>innerWidth-8)px=x-w-14;if(px<8)px=8;var py=y-h-10;if(py<8)py=y+18;if(py+h>innerHeight-8)py=Math.max(8,innerHeight-h-8);tip.style.left=px+"px";tip.style.top=py+"px";}
  function hideTip(){tip.style.opacity="0";tipOn=false;}
  document.addEventListener("click",function(e){if(tipOn&&!(e.target.closest&&e.target.closest(".bar,.hit")))hideTip();});
  window.addEventListener("scroll",function(){if(tipOn)hideTip();},{passive:true});
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function nf(n){return Number(n).toLocaleString("en-GB");}
  function r1(v){return Math.round(v*10)/10;}
  function pl(n,one,many){return nf(n)+" "+(n===1?one:many);}

  function cw(el,min){return Math.max(min||280,Math.round(el.clientWidth||0));}
  var MON=M.MONS;

  /* ---------- tooltips ---------- */
  function tipHTML(title,value,listTitle,lines,foot){
    var s="<div>"+esc(title)+"</div><div class=\"t2\">"+esc(value)+"</div>";
    if(lines&&lines.length){s+="<div class=\"tl\">"+esc(listTitle)+"</div><ol>"+lines.map(function(l){return "<li>"+esc(l)+"</li>";}).join("")+"</ol>";}
    if(foot)s+="<div class=\"tf\">"+esc(foot)+"</div>";
    return s;}
  function wire(el,tips){el.querySelectorAll("[data-t]").forEach(function(m){
    var show=function(e){showTip(tips[+m.getAttribute("data-t")],e.clientX,e.clientY);};
    m.addEventListener("mousemove",show);m.addEventListener("click",show);m.addEventListener("mouseleave",hideTip);
    var k=m.getAttribute("data-k");if(k&&el._onPick)m.addEventListener("click",function(){el._onPick(k);});});}
  var NAMES="example names",RESTRICT="Names are restricted to the case owner.";
  function yrs(t){return t<1?"under 1 yr":Math.floor(t)+" yrs";}
  function topServing(list){return list.slice().sort(function(a,b){return b.tenure-a.tenure;}).slice(0,3).map(function(p){return p.name+", "+p.role+", "+yrs(p.tenure);});}
  function topStarters(list){return list.slice().sort(function(a,b){return a.tenure-b.tenure;}).slice(0,3).map(function(p){return p.name+", "+p.role+", started "+M.startMon(p);});}
  function topOverdue(list){return list.slice().sort(function(a,b){return b.days-a.days;}).slice(0,3).map(function(x){return x.name+", "+x.role+", "+x.days+" days overdue";});}
  function topLTS(list,by){return list.slice().sort(function(a,b){return b.weeks-a.weeks;}).slice(0,3).map(function(x){return x.ref+", "+(by==="site"?x.site:x.role)+", "+x.weeks+" wks";});}
  function topER(list,by){return list.slice().sort(function(a,b){return b.age-a.age;}).slice(0,3).map(function(x){return x.ref+", "+(by==="dept"?M.DMAP[M.CELLS[x.ci].d].name:x.type)+", "+x.age+" days";});}
  function count(list,keyFn){var o={};list.forEach(function(x){var k=keyFn(x);o[k]=(o[k]||0)+1;});return o;}
  function top3(pairs,fmt){return pairs.filter(function(p){return p[1]>0;}).sort(function(a,b){return b[1]-a[1];}).slice(0,3).map(function(p){return p[0]+", "+fmt(p[1]);});}
  /* next level down from the current selection: departments, then roles */
  function dim(s){if(s.dept==="all")return {k:"dept",label:"departments",items:M.DEPTS.map(function(d){return [d.name,d.id];})};
    if(s.role==="all")return {k:"role",label:"roles",items:M.DMAP[s.dept].roles.map(function(r){return [r[0],r[0]];})};return null;}
  function dimTop(s,valFn,fmt,low){var d=dim(s);if(!d)return [];
    var pairs=d.items.map(function(it){var sub=M.sub(s,d.k,it[1]);return [it[0],valFn(sub,M.mask(sub))];}).filter(function(p){return p[1]!=null;});
    pairs.sort(function(a,b){return low?a[1]-b[1]:b[1]-a[1];});
    return pairs.slice(0,3).map(function(p){return p[0]+", "+fmt(p[1]);});}
  function dimLabel(s,prefix){var d=dim(s);return d?prefix+" "+d.label:"";}
  function roleKey(x){return x.role;}

  /* ---------- chart primitives ---------- */
  function lineChart(id,series,o){
    o=o||{};var el=$("#"+id),W=cw(el,300),H=W<480?230:290,L=44,R=16,T=14,B=28,pw=W-L-R,ph=H-T-B;
    var yMax=o.yMax||5,n=series.length,labels=o.labels||MON,unit=o.unit||"%",tks=o.ticks||5;
    var X=function(i){return L+pw*i/(n-1);},Y=function(v){return T+ph*(1-v/yMax);};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||"Line chart")+'">';
    for(var t=0;t<=tks;t++){var v=yMax*t/tks,y=Y(v);s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="ax" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+unit+'</text>';}
    for(var i=0;i<n;i+=(W<480?3:(n>8?2:1))){s+='<text class="ax" x="'+X(i)+'" y="'+(H-9)+'" text-anchor="middle">'+labels[i]+'</text>';}
    if(o.target!=null){var ty=Y(o.target);s+='<line x1="'+L+'" y1="'+ty+'" x2="'+(W-R)+'" y2="'+ty+'" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 5"/><text class="ax" x="'+(L+4)+'" y="'+(ty-6)+'" text-anchor="start" style="fill:var(--warn);font-weight:700">Target '+o.target+unit+'</text>';}
    var dp="",ar="M"+X(0)+" "+(T+ph);
    for(var j=0;j<n;j++){dp+=(j?"L":"M")+X(j)+" "+Y(series[j])+" ";ar+="L"+X(j)+" "+Y(series[j])+" ";}
    ar+="L"+X(n-1)+" "+(T+ph)+" Z";
    s+='<path d="'+ar+'" fill="var(--brand)" opacity="0.08"/><path d="'+dp+'" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    for(var k=0;k<n;k++)s+='<circle cx="'+X(k)+'" cy="'+Y(series[k])+'" r="'+(k===n-1?4.5:3)+'" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"/>';
    s+='<text x="'+X(n-1)+'" y="'+(Y(series[n-1])-12)+'" text-anchor="end" class="vlab" style="fill:var(--brand-deep)">'+series[n-1]+unit+'</text>';
    s+='<line class="cx" x1="0" y1="'+T+'" x2="0" y2="'+(T+ph)+'" stroke="var(--brand)" stroke-width="1" opacity="0"/>';
    var step=pw/(n-1);
    for(var h=0;h<n;h++)s+='<rect class="hit" x="'+(X(h)-step/2)+'" y="'+T+'" width="'+step+'" height="'+ph+'" data-i="'+h+'"/>';
    s+='</svg>';el.innerHTML=s;
    var svg=$("svg",el),cx=$(".cx",el);
    el.querySelectorAll(".hit").forEach(function(r){
      var show=function(){var i=+r.getAttribute("data-i"),bb=svg.getBoundingClientRect(),sc=bb.width/W;
        cx.setAttribute("x1",X(i));cx.setAttribute("x2",X(i));cx.setAttribute("opacity","1");
        showTip(o.tips[i],bb.left+X(i)*sc,bb.top+Y(series[i])*sc);};
      r.addEventListener("mousemove",show);r.addEventListener("click",show);
      r.addEventListener("mouseleave",function(){cx.setAttribute("opacity","0");hideTip();});
    });
  }
  /* items: [label, value, tipHTML] */
  function hbars(id,items,o){
    o=o||{};var el=$("#"+id),W=cw(el),rowH=32,padT=6,L=o.labelW||104,R=52,pw=W-L-R,H=padT+Math.max(1,items.length)*rowH+6;
    var max=o.max||Math.max.apply(null,items.map(function(x){return x[1];}).concat([1])),unit=o.unit||"",tips=[],fv=function(v){return o.dp?v.toFixed(o.dp):nf(v);};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||"Bar chart")+'">';
    if(o.target!=null){var tx=L+pw*o.target/max;s+='<line x1="'+tx+'" y1="'+padT+'" x2="'+tx+'" y2="'+(H-6)+'" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 4"/>';}
    items.forEach(function(it,i){var y=padT+i*rowH,bw=Math.max(pw*it[1]/max,2),over=o.target!=null&&(o.lowerBetter?it[1]>o.target:it[1]<o.target);
      tips.push(it[2]||tipHTML(it[0],it[1]+unit));
      s+='<text class="ax" x="'+(L-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end">'+esc(it[0])+'</text>';
      s+='<rect x="'+L+'" y="'+(y+5)+'" width="'+bw+'" height="'+(rowH-12)+'" rx="4" fill="var(--brand)" class="bar" data-t="'+i+'"/>';
      s+='<text x="'+(L+bw+6)+'" y="'+(y+rowH/2+4)+'" class="vlab" '+(over?'style="fill:var(--risk)"':'')+'>'+fv(it[1])+unit+'</text>';});
    s+='</svg>';el.innerHTML=s;wire(el,tips);
  }
  /* rows: [label, a, b, tipA, tipB] */
  function stacked(id,rows,o){
    o=o||{};var el=$("#"+id),W=cw(el),H=240,L=44,R=10,T=14,B=26,pw=W-L-R,ph=H-T-B,tips=[];
    var tot=rows.map(function(r){return r[1]+r[2];}),mx=Math.max.apply(null,tot.concat([1])),step=Math.pow(10,Math.floor(Math.log(mx)/Math.LN10)),max=Math.ceil(mx/step)*step;
    if(max/step<=2){step=step/2;max=Math.ceil(mx/step)*step;}
    var n=rows.length,bw=Math.min(52,pw/n*0.6),gap=(pw-bw*n)/(n+1),Y=function(v){return T+ph*(1-v/max);};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||"Stacked columns")+'">';
    for(var t=0;t<=4;t++){var v=max*t/4,y=Y(v);s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+nf(Math.round(v))+'</text>';}
    rows.forEach(function(r,i){var x=L+gap+i*(bw+gap),sh=ph*r[1]/max,lo=ph*r[2]/max,yb=T+ph;
      tips.push(r[3]);tips.push(r[4]);
      s+='<rect x="'+x+'" y="'+(yb-sh)+'" width="'+bw+'" height="'+sh+'" rx="3" fill="var(--brand)" class="bar" data-t="'+(i*2)+'"/>';
      s+='<rect x="'+x+'" y="'+(yb-sh-lo-2)+'" width="'+bw+'" height="'+lo+'" rx="3" fill="var(--cyan)" class="bar" data-t="'+(i*2+1)+'"/>';
      s+='<text class="ax" x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+r[0]+'</text>';
      s+='<text class="vlab" x="'+(x+bw/2)+'" y="'+(yb-sh-lo-8)+'" text-anchor="middle" style="font-size:10px">'+nf(r[1]+r[2])+'</text>';});
    s+='</svg>';el.innerHTML=s;wire(el,tips);
  }
  function groupedCols(id,rows,o){
    o=o||{};var el=$("#"+id),W=cw(el),H=240,L=34,R=10,T=16,B=26,pw=W-L-R,ph=H-T-B,tips=[];
    var mx=Math.max.apply(null,rows.map(function(r){return Math.max(r[1],r[2]);}).concat([1])),st=[4,8,20,40,80,200,400].filter(function(v){return mx<=v*4;})[0]||Math.ceil(mx/4),max=Math.ceil(mx/st)*st;if(max%4)max=Math.ceil(max/4)*4;
    var n=rows.length,grp=pw/n,bw=Math.min(22,grp*0.32),Y=function(v){return T+ph*(1-v/max);};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||"Grouped columns")+'">';
    for(var t=0;t<=4;t++){var v=max*t/4,y=Y(v);s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+'</text>';}
    rows.forEach(function(r,i){var cx=L+grp*i+grp/2,yb=T+ph;var ha=ph*r[1]/max,hb=ph*r[2]/max;
      tips.push(r[3]);tips.push(r[4]);
      s+='<rect x="'+(cx-bw-1)+'" y="'+(yb-ha)+'" width="'+bw+'" height="'+Math.max(ha,1)+'" rx="3" fill="var(--brand)" class="bar" data-t="'+(i*2)+'"/>';

  /* items: {id,label,short,group,value,tip} */
  function deptBars(id,items,o){

  /* ---------- status against target ---------- */
  var T={abs:3.0,attr:12,fy:20,tth:42,comp:95};
  var LAB={good:"On target",warn:"Watch",risk:"Action"};
  function rag(k,m){var v,c;
    if(k==="abs"){v=r1(m.absRate);c=v<=3.0?"good":(v<=3.5?"warn":"risk");}
    else if(k==="attr"){v=r1(m.attr);c=v<=12?"good":(v<=15?"warn":"risk");}
    else if(k==="fy"){v=Math.round(m.fy);c=v<=20?"good":(v<=25?"warn":"risk");}
    else if(k==="tth"){v=Math.round(m.tth);c=v<=42?"good":(v<=48?"warn":"risk");}
    else if(k==="comp"){v=Math.round(m.comp);c=v>=95?"good":(v>=90?"warn":"risk");}
    else {var sh=m.erOpen?m.erAged/m.erOpen:0;c=m.erTrib>0?(sh>0.2||m.erTrib>=3?"risk":"warn"):(sh>0.1?"warn":"good");}
    return c;}
  function pill(code,label){return '<span class="pill p-'+code+'">'+esc(label||LAB[code])+'</span>';}

  /* ---------- builders ---------- */
  function kpiHTML(arr,six){return '<div class="kpis'+(six?' six':'')+'">'+arr.map(function(k){
    return '<div class="kpi'+(k.st?' s-'+k.st:'')+'"><div class="k-l">'+esc(k.l)+'</div><div class="k-v">'+esc(k.v)+'</div>'

  function tableCard(title,sub,head,rows){return '<div class="card"><h2>'+title+'</h2><p class="h-sub">'+sub+'</p><div style="overflow-x:auto"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';}
  function leg(a,b){return '<div class="legend"><span><i style="background:var(--brand)"></i>'+a+'</span><span><i style="background:var(--cyan)"></i>'+b+'</span></div>';}
  function deptCard(title,sub){return '<div class="card"><h2>'+title+'</h2><p class="h-sub">'+sub+' Click a bar to filter by that department.</p><div class="legend"><span><i style="background:var(--brand)"></i>Delivery</span><span><i style="background:var(--cyan)"></i>Corporate</span></div><div id="c_byd"></div></div>';}

  /* ---------- state ---------- */
  var state={region:"all",dept:"all",role:"all"},cur="summary";
  function sel(){return {region:state.region,dept:state.dept,role:state.role};}
  function regName(){return state.region==="all"?"UK & Ireland":M.RMAP[state.region].name;}
  function scopeName(){var where=state.region==="all"?"across UK & Ireland":"in "+M.RMAP[state.region].name;
    if(state.role!=="all")return state.role+" roles "+where;
    if(state.dept!=="all")return M.DMAP[state.dept].name+" "+where;
    return regName();}
  function locWord(){return state.region==="all"?"region":"site";}
  function byLoc(list){var s=sel(),o={};M.locs(s).forEach(function(n){o[n]=[];});list.forEach(function(x){var k=M.locOf(x,s);if(o[k])o[k].push(x);});return o;}
  function ukSel(){return {region:"all",dept:state.dept,role:state.role};}

  /* ---------- commentary ---------- */

  function topKey(list,keyFn){var c=count(list,keyFn),best=null;Object.keys(c).forEach(function(k){if(!best||c[k]>c[best])best=k;});return best?[best,c[best]]:null;}
  function leaverGroup(m){if(state.role!=="all")return null;
    return state.dept==="all"?topKey(m.leavers,function(x){return M.DMAP[M.CELLS[x.ci].d].name;}):topKey(m.leavers,roleKey);}
  function findings(m,uk){

      good:"Absence is "+a+"%, inside the 3.0% target.",
      act:m.lt26?"Review each long-term absence case open for 26 weeks or more with the line manager and occupational health, and agree a dated next step.":"Hold a monthly review of long-term absence cases with line managers so that none passes 26 weeks without a decision."});
    var lg=leaverGroup(m),tr=topKey(m.leavers,function(x){return x.reason;});

      good:"Attrition is "+at+"%, inside the 12% target.",
      act:"Run stay interviews"+(lg?" in "+lg[0]:"")+" and check pay and progression routes against the reasons people give for leaving."});
    f.push({k:"fy",st:rag("fy",m),sev:(fy-T.fy)/T.fy*0.8,

      good:"First-year attrition is "+fy+"%, inside the 20% target.",

    f.push({k:"er",st:rag("er",m),sev:m.erOpen?(m.erAged/m.erOpen-0.1)+m.erTrib*0.03:-1,
      text:pl(m.erOpen,"ER case is","ER cases are")+" open. "+(m.erAged?m.erAged+(m.erAged===1?" is":" are")+" older than 60 days"+(m.erTrib?", and "+m.erTrib+" of those "+(m.erTrib===1?"is":"are")+" older than 90 days, where tribunal risk is highest.":"."):"None is older than 60 days."),
      good:pl(m.erOpen,"ER case is","ER cases are")+" open and "+(m.erAged?"only "+m.erAged+(m.erAged===1?" is":" are"):"none is")+" older than 60 days.",
      act:"Agree a resolution plan and an owner for every ER case over 60 days, and take legal advice early on those over 90 days."});
    var tc=topKey(m.overdue,function(x){return x.course;});

      text:"Training compliance is "+cp+"% against a 95% target, with "+pl(m.overdue.length,"overdue record","overdue records")+"."+(tc?" "+tc[0]+" has the most overdue ("+tc[1]+").":""),
      good:"Training compliance is "+cp+"%, meeting the 95% target.",
      act:"Book the overdue "+(tc?tc[0]+" ":"")+"places first, and send each manager their own overdue list every month."});
    f.push({k:"tth",st:rag("tth",m),sev:(tth-T.tth)/T.tth*0.8,

  function extremes(){var rows=M.REGIONS.map(function(r){return [r.name,M.metrics({region:r.id,dept:state.dept,role:state.role})];}).filter(function(x){return x[1].head>=10;});

  function summaryText(m,uk){
    var f=findings(m,uk),s=sel(),sites=state.region==="all"?M.REGIONS.reduce(function(a,r){return a+r.sites.length;},0):M.RMAP[state.region].sites.length;
    var p1=scopeName()+": "+pl(m.head,"colleague","colleagues")+(state.region==="all"?" across 6 regions and "+sites+" sites.":" across "+sites+" sites, "+Math.round(m.head/uk.head*100)+"% of "+(state.dept==="all"&&state.role==="all"?"the UK & Ireland workforce.":"this group across UK & Ireland."));
    if(state.region==="all")p1+=" "+extremes();

    if(!good.length){
      if(state.region==="all")good=["Absence has fallen from "+M.ABS_TREND[0]+"% to "+r1(m.absRate)+"% over the last 12 months, and training compliance has risen from "+M.TR_TREND[0]+"% to "+Math.round(m.comp)+"%."];
      else{var rel=[];if(r1(m.absRate)<r1(uk.absRate))rel.push("Absence ("+r1(m.absRate)+"%) is below the UK & Ireland figure of "+r1(uk.absRate)+"%, although still above target.");
        if(r1(m.attr)<r1(uk.attr))rel.push("Attrition ("+r1(m.attr)+"%) is below the UK & Ireland figure of "+r1(uk.attr)+"%, although still above target.");
        if(Math.round(m.comp)>Math.round(uk.comp))rel.push("Training compliance ("+Math.round(m.comp)+"%) is above the UK & Ireland figure of "+Math.round(uk.comp)+"%, although still below target.");

    hbars("c_site",sites,{max:Math.max(5,Math.ceil(Math.max.apply(null,sites.map(function(x){return x[1];})))),target:3.0,unit:"%",dp:1,labelW:124,lowerBetter:true,aria:"Absence rate by location"});
    hbars("c_reason",M.ABS_REASON.map(function(r){var days=Math.round(m.days*r[1]/100);
      return [r[0],r[1],tipHTML(r[0],r[1]+"% of days lost, about "+nf(days)+" days",dimLabel(s,"Top three"),dimTop(s,function(sub){var x=M.metrics(sub);return Math.round(x.days*r[1]/100*M.hf(r[0]+sub.dept+sub.role,0.75,1.25));},function(x){return nf(x)+" days";}),"Shown by group only. Reasons are never shown for an individual.")];}),{unit:"%",labelW:112,aria:"Days lost by reason"});
    stacked("c_split",m.split.map(function(q,k){return [q[0],q[1],q[2],
      tipHTML(q[0]+", short-term",nf(q[1])+" days",dimLabel(s,"Top three"),dimTop(s,function(sub,mk){return M.sumC(M.cShort[k],mk);},function(x){return nf(x)+" days";})),
      tipHTML(q[0]+", long-term",nf(q[2])+" days",dimLabel(s,"Top three"),dimTop(s,function(sub,mk){return M.sumC(M.cLong[k],mk);},function(x){return nf(x)+" days";}))];}),{aria:"Short and long-term days lost by quarter"});
  }
  function renderER(m,uk){
    var s=sel();
    var kp=[{l:"Open cases",v:nf(m.erOpen),d:"all case types",dc:"c-flat",s:"current caseload"},
      {l:"Avg case age",v:Math.round(m.erAvg)+" days",d:"time open",dc:"c-flat",s:"open cases"},
      {l:"Aged > 60 days",v:nf(m.erAged),st:rag("er",m),s:"61-90 and 90+ bands"},
      {l:"Tribunal-risk",v:nf(m.erTrib),d:m.erTrib?"over 90 days":"none over 90 days",dc:m.erTrib?"c-risk":"c-good",s:"oldest, highest risk"},
      {l:"Resolved, no claim",v:nf(m.resolved),d:"this year",dc:"c-good",s:"closed without a claim"}];
    var aged=m.er.filter(function(x){return x.age>60;}).sort(function(x,y){return y.age-x.age;}).slice(0,8);
    var rows=aged.map(function(x){return '<tr><td>'+x.ref+'</td><td>'+esc(x.site)+'</td><td>'+esc(x.type)+'</td><td class="n">'+x.age+'</td><td>'+pill(x.age>90?"risk":"warn",x.age>90?"At risk":"Watch")+'</td></tr>';}).join("")||'<tr><td colspan="5">No cases over 60 days for this selection.</td></tr>';
    $("#page").innerHTML=kpiHTML(kp)+insight("What this shows: "+scopeName(),pageText(["er"],m,uk))
      +deptCard("Open cases by department","Current caseload split across departments.")
      +'<div class="grid">'+card("Cases opened vs closed","Last 6 months.","c_flow",leg("Opened","Closed"))+card("Open cases by type","Current caseload.","c_type")+'</div>'
      +'<div class="grid2">'+card("Case age","Open cases by age band.","c_age")+card("Open cases by "+locWord(),"Current caseload.","c_ersite")
      +tableCard("Tribunal-risk and aged cases","Open cases over 60 days, oldest first. Case references only.",'<th>Ref</th><th>Site</th><th>Type</th><th class="n">Age (d)</th><th>Status</th>',rows)+'</div>';
    renderDeptBreak("er");
    groupedCols("c_flow",m.flow.map(function(q,k){return [q[0],q[1],q[2],
      tipHTML(q[0]+", opened",pl(q[1],"case","cases"),dimLabel(s,"Top three"),dimTop(s,function(sub,mk){return M.sumC(M.cOpened[k],mk);},function(x){return pl(x,"case","cases");}).filter(function(l){return !/, 0 cases$/.test(l);})),
      tipHTML(q[0]+", closed",pl(q[2],"case","cases"),dimLabel(s,"Top three"),dimTop(s,function(sub,mk){return M.sumC(M.cClosed[k],mk);},function(x){return pl(x,"case","cases");}).filter(function(l){return !/, 0 cases$/.test(l);}))];}),{aria:"ER cases opened and closed by month"});
    var ct=count(m.er,function(x){return x.type;});
    hbars("c_type",M.ER_TYPE.map(function(t){var l=m.er.filter(function(x){return x.type===t[0];});return [t[0],ct[t[0]]||0,tipHTML(t[0],pl(l.length,"open case","open cases"),"Oldest open cases",topER(l,"dept"),l.length?RESTRICT:"")];}).sort(function(x,y){return y[1]-x[1];}),{labelW:118,aria:"Open ER cases by type"});
    hbars("c_age",M.ER_BANDS.map(function(b){var l=m.er.filter(function(x){return x.band===b[0];});return [b[0],l.length,tipHTML(b[0],pl(l.length,"open case","open cases"),"Oldest open cases",topER(l,"type"),l.length?RESTRICT:"")];}),{labelW:88,aria:"Open ER cases by age band"});
    var bl=byLoc(m.er);
    hbars("c_ersite",M.locs(s).map(function(n){return [n,bl[n].length,tipHTML(n,pl(bl[n].length,"open case","open cases"),"Oldest open cases",topER(bl[n],"type"),bl[n].length?RESTRICT:"")];}).sort(function(x,y){return y[1]-x[1];}),{labelW:124,aria:"Open ER cases by location"});
  }
  function renderHC(m,uk){
    var s=sel(),at=r1(m.attr),f=m.attr/uk0.attr;
    var kp=[{l:"Headcount",v:nf(m.head),d:pl(m.starters.length,"starter","starters")+" in 12 months",dc:"c-flat",s:"colleagues, avg tenure "+r1(m.tenure).toFixed(1)+" yrs"},
      {l:"Attrition (12m)",v:at+"%",st:rag("attr",m),s:"target 12%"},
      {l:"Voluntary attrition",v:r1(m.vol)+"%",d:pl(m.leavers.length,"leaver","leavers")+" in total",dc:"c-flat",s:"resignations, 12 months"},
      {l:"First-year attrition",v:Math.round(m.fy)+"%",st:rag("fy",m),s:"target 20%"},
      {l:"Time to hire",v:Math.round(m.tth)+" days",st:rag("tth",m),s:"target 42 days"}];
    var pb=byLoc(m.people),lb=byLoc(m.leavers);
    var rows=M.locs(s).map(function(n){return [n,pb[n].length,lb[n].length];}).filter(function(x){return x[1]>0;}).sort(function(x,y){return y[1]-x[1];}).map(function(x){
      if(x[1]<10)return '<tr><td>'+esc(x[0])+'</td><td class="n">'+x[1]+'</td><td class="n">Hidden</td><td></td></tr>';
      var v=r1(x[2]/x[1]*100),c=v>15?"risk":(v>12?"warn":"good");return '<tr><td>'+esc(x[0])+'</td><td class="n">'+nf(x[1])+'</td><td class="n">'+v+'%</td><td>'+pill(c,c==="risk"?"High":(c==="warn"?"Watch":"Stable"))+'</td></tr>';}).join("");
    $("#page").innerHTML=kpiHTML(kp)+insight("What this shows: "+scopeName(),pageText(["attr","fy","tth"],m,uk))
      +deptCard("Headcount by department","Colleagues in each department.")
      +'<div class="grid">'+card("Attrition rate vs target","Rolling 12 months. Target 12%.","c_attr")+card("Headcount by "+locWord(),"Colleagues at each location.","c_hc")+'</div>'
      +'<div class="grid2">'+card("Reasons for leaving","Share of leavers.","c_reason")+card("Starters vs leavers","By quarter.","c_flow",leg("Starters","Leavers"))
      +tableCard("Attrition by "+locWord(),"Leavers in 12 months as a share of headcount.",'<th>Location</th><th class="n">Headcount</th><th class="n">Attrition</th><th>Risk</th>',rows)+'</div>';
    renderDeptBreak("hc");
    var trend=M.HC_TREND.map(function(v){return r1(v*f);});trend[trend.length-1]=at;
    lineChart("c_attr",trend,{target:12,yMax:Math.max(20,Math.ceil(Math.max.apply(null,trend)/5)*5),ticks:5,aria:"Attrition rate by month",
      tips:trend.map(function(v,i){var k=v/Math.max(at,0.01);return tipHTML(MON[i],"Attrition "+v+"% (target 12%)",dimLabel(s,"Highest"),dimTop(s,function(sub){var x=M.metrics(sub);return x.head>=10?r1(x.attr*k):null;},function(x){return x+"%";}));})});
    hbars("c_hc",M.locs(s).map(function(n){return [n,pb[n].length,tipHTML(n,nf(pb[n].length)+" people","Longest serving ("+NAMES+")",topServing(pb[n]))];}).sort(function(x,y){return y[1]-x[1];}),{labelW:124,aria:"Headcount by location"});
    var cr=count(m.leavers,function(x){return x.reason;}),nL=Math.max(1,m.leavers.length);
    hbars("c_reason",M.HC_REASON.map(function(r){var l=m.leavers.filter(function(x){return x.reason===r[0];});
      return [r[0],Math.round((cr[r[0]]||0)/nL*100),tipHTML(r[0],pl(l.length,"leaver","leavers"),"Top three roles",top3(Object.keys(count(l,roleKey)).map(function(k){return [k,count(l,roleKey)[k]];}),function(x){return pl(x,"leaver","leavers");}))];}).sort(function(x,y){return y[1]-x[1];}),{unit:"%",labelW:120,aria:"Reasons for leaving"});
    groupedCols("c_flow",M.QTR.map(function(q,k){var st=m.starters.filter(function(p){return M.startQ(p)===k;}),lv=m.leavers.filter(function(x){return x.q===k;});
      return [q,st.length,lv.length,tipHTML(q+", starters",pl(st.length,"starter","starters"),"Most recent starters ("+NAMES+")",topStarters(st)),
        tipHTML(q+", leavers",pl(lv.length,"leaver","leavers"),"Top three roles",top3(Object.keys(count(lv,roleKey)).map(function(kk){return [kk,count(lv,roleKey)[kk]];}),function(x){return pl(x,"leaver","leavers");}))];}),{aria:"Starters and leavers by quarter"});
  }
  function renderTrain(m,uk){
    var s=sel(),cp=Math.round(m.comp),d=m.comp-90;
    var kp=[{l:"Overall compliance",v:cp+"%",st:rag("comp",m),s:"target 95%"},
      {l:"Courses tracked",v:String(M.COURSES.length),d:"mandatory",dc:"c-flat",s:"safety and compliance"},
      {l:"Fully compliant",v:Math.round(m.fully)+"%",d:"▲ improving",dc:"c-good",s:"of colleagues"},
      {l:"Overdue",v:nf(m.overdue.length),d:"▼ reducing",dc:"c-good",s:"records"},
      {l:"Expiring 30 days",v:nf(m.expiring),d:"renew soon",dc:"c-flat",s:"records"}];
    var cc=count(m.overdue,function(x){return x.course;}),expW=M.alloc(m.expiring,M.COURSES.map(function(c){return 60+c.w;}));
    function clvl(c){return Math.max(50,Math.min(100,Math.round(m.comp+c.off)));}
    var rows=M.COURSES.map(function(c,i){var v=clvl(c),code=v>=95?"good":(v>=90?"warn":"risk");return '<tr><td>'+esc(c.name)+'</td><td class="n">'+v+'%</td><td class="n">'+(cc[c.name]||0)+'</td><td class="n">'+expW[i]+'</td><td>'+pill(code)+'</td></tr>';}).join("");
    $("#page").innerHTML=kpiHTML(kp)+insight("What this shows: "+scopeName(),pageText(["comp"],m,uk))
      +deptCard("Compliance by department","Latest, with the 95% target.")
      +'<div class="grid">'+card("Compliance trend vs target","Rolling 12 months. Target 95%.","c_trend")+card("Compliance by "+locWord(),"Latest. Dashed line is the 95% target.","c_site")+'</div>'
      +'<div class="grid2">'+card("Compliance by course","Dashed line is the 95% target.","c_course")+card("Overdue records by course","Where the gap is.","c_over")
      +tableCard("Course detail","Compliance, overdue and renewals.",'<th>Course</th><th class="n">Compliant</th><th class="n">Overdue</th><th class="n">Exp. 30d</th><th>Status</th>',rows)+'</div>';
    renderDeptBreak("train");
    var trend=M.TR_TREND.map(function(v){return Math.max(50,Math.min(100,Math.round(v+d)));});trend[trend.length-1]=cp;
    lineChart("c_trend",trend,{target:95,yMax:100,ticks:5,aria:"Training compliance by month",
      tips:trend.map(function(v,i){return tipHTML(MON[i],"Compliance "+v+"% (target 95%)",dimLabel(s,"Lowest"),dimTop(s,function(sub){var x=M.metrics(sub);return x.head?Math.max(50,Math.min(100,Math.round(x.comp+(v-cp)))):null;},function(x){return x+"%";},true));})});
    var ob=byLoc(m.overdue);
    hbars("c_site",M.locs(s).map(function(n){var v;
      if(s.region==="all"){var rid=M.REGIONS.filter(function(r){return r.name===n;})[0].id;v=Math.round(M.metrics(M.sub(s,"region",rid)).comp);}
      else v=Math.max(50,Math.min(100,Math.round(m.comp+M.hf(n,-2,2))));
      return [n,v,tipHTML(n,v+"% compliant (target 95%)","Longest overdue ("+NAMES+")",topOverdue(ob[n]))];}).sort(function(x,y){return y[1]-x[1];}),{max:100,target:95,unit:"%",labelW:124,lowerBetter:false,aria:"Training compliance by location"});
    hbars("c_course",M.COURSES.map(function(c){var l=m.overdue.filter(function(x){return x.course===c.name;});return [c.name,clvl(c),tipHTML(c.name,clvl(c)+"% compliant (target 95%)","Longest overdue ("+NAMES+")",topOverdue(l))];}),{max:100,target:95,unit:"%",labelW:128,lowerBetter:false,aria:"Training compliance by course"});
    hbars("c_over",M.COURSES.map(function(c){var l=m.overdue.filter(function(x){return x.course===c.name;});return [c.name,l.length,tipHTML(c.name,pl(l.length,"overdue record","overdue records"),"Longest overdue ("+NAMES+")",topOverdue(l))];}).sort(function(x,y){return y[1]-x[1];}),{labelW:128,aria:"Overdue training records by course"});
  }
  function renderReal(){
    $("#page").innerHTML=
      '<div class="card insight prose"><h2>From sample data to live data</h2><p>This dashboard runs on invented sample data. I built it to show how I would report on the people measures a Regional HR Manager is accountable for. The layout, the measures and the targets are a starting point for discussion, and I would agree the final versions with the HR leadership team.</p><p>The live version would be built in Power BI on top of your HR system, so the figures refresh on a schedule and nobody has to compile a monthly pack by hand.</p></div>'
      +'<div class="cols2">'
      +'<div class="card prose"><h2>Data I would connect</h2><p class="h-sub">One source for each measure, agreed with the system owners.</p><ul>'
      +'<li><strong>HR system:</strong> headcount, starters, leavers, reasons for leaving, reporting lines.</li>'
      +'<li><strong>Payroll and absence records:</strong> days lost, absence reasons, trigger points, cost.</li>'
      +'<li><strong>ER case log:</strong> case type, date opened, stage, owner, outcome.</li>'
      +'<li><strong>Recruitment system:</strong> vacancy approval date, offer date, start date.</li>'
      +'<li><strong>Learning system:</strong> mandatory courses, completion and expiry dates.</li></ul></div>'
      +'<div class="card prose"><h2>Questions it would answer each month</h2><p class="h-sub">For regional directors and the HR leadership team.</p><ul>'
      +'<li>Where is absence costing the most, and which long-term cases need a decision?</li>'
      +'<li>Which ER cases are ageing, and which carry tribunal risk?</li>'
      +'<li>Where are we losing people in their first year, and why?</li>'
      +'<li>Which sites are below target on safety-critical training?</li>'
      +'<li>How long does it take to fill a vacancy in each region?</li></ul></div>'
      +'</div>'
      +'<div class="cols2">'
      +'<div class="card prose"><h2>My first 90 days with the data</h2><p class="h-sub">A realistic plan, adjusted once I have seen the systems.</p><ul>'
      +'<li><strong>Days 1 to 30:</strong> agree the measure definitions and targets. Get access to each data source and check the quality of the data, especially leaving reasons and case dates.</li>'
      +'<li><strong>Days 31 to 60:</strong> replace the sample data with live data for one region as a pilot. Check the figures with the HR team and line managers before anyone relies on them.</li>'
      +'<li><strong>Days 61 to 90:</strong> roll out to all regions. Start a monthly review with regional directors, with an owner and a date against every action.</li></ul></div>'
      +'<div class="card prose"><h2>GDPR and who can see what</h2><p class="h-sub">People data needs tighter control than most business data.</p><ul>'
      +'<li><strong>UK GDPR:</strong> the live version would follow UK GDPR, the Data Protection Act 2018 and ICO guidance on employment records. Absence and health information is special category data, so the dashboard would hold only what is needed and a data protection impact assessment would be completed before launch.</li>'
      +'<li><strong>Row-level security (RLS):</strong> RLS in Power BI would filter every page by reporting line. When a manager signs in, they see only the colleagues who report up to them, directly or through their own managers. Nobody sees another manager\'s team.</li>'
      +'<li><strong>Named detail:</strong> names appear only on low-sensitivity measures such as length of service and overdue training. Absence and ER cases show a case reference, and the names stay in the case file with the case owner.</li>'
      +'<li><strong>Small groups:</strong> figures for groups of fewer than 10 colleagues are hidden, so that an individual cannot be identified. You can test this now by selecting a single job role in one region.</li>'
      +'<li><strong>Example names:</strong> every name in this demonstration is invented.</li></ul></div>'
      +'</div>';
  }

  var PAGES=[{id:"summary",name:"Summary",sub:"Headlines and actions",fn:renderSummary},
    {id:"absence",name:"Absence",sub:"Absence and attendance",fn:renderAbsence},
    {id:"er",name:"Employee Relations",sub:"ER caseload and risk",fn:renderER},
    {id:"hc",name:"Headcount & Attrition",sub:"Workforce and retention",fn:renderHC},
    {id:"train",name:"Training Compliance",sub:"Mandatory training",fn:renderTrain},
    {id:"real",name:"With real data",sub:"From sample to live",fn:renderReal}];
  var uk0=M.metrics({region:"all",dept:"all",role:"all"});

  function populateRoles(){
    var rsel=$("#role");
    if(state.dept==="all"){rsel.innerHTML='<option value="all">All roles</option>';rsel.disabled=true;rsel.value="all";state.role="all";return;}
    rsel.disabled=false;var dep=M.DMAP[state.dept];
    rsel.innerHTML='<option value="all">All roles in '+esc(dep.name)+'</option>'+dep.roles.map(function(r){return '<option value="'+esc(r[0])+'">'+esc(r[0])+'</option>';}).join("");
    if(!dep.roles.some(function(r){return r[0]===state.role;}))state.role="all";
    rsel.value=state.role;}
  function syncSlicers(){$("#region").value=state.region;$("#dept").value=state.dept;populateRoles();}
  function draw(){var p=PAGES.filter(function(x){return x.id===cur;})[0];hideTip();
    $("#bandsub").textContent=p.sub;
    $("#slicers").style.display=cur==="real"?"none":"";
    $("#reset").hidden=(state.region==="all"&&state.dept==="all"&&state.role==="all");
    if(cur==="real"){renderReal();}
    else{var m=M.metrics(sel()),uk=M.metrics(ukSel());
      if(m.head<10)$("#page").innerHTML=suppressed(m);else p.fn(m,uk);}
    $("#foot").textContent="Prepared by Paul Akomeah MCIPD for interview discussion, October 2026. Illustrative sample data: every figure and every name is invented and none of it comes from Omexom. This is not an Omexom publication. In live use, row-level security would limit each manager to the colleagues who report up to them, and figures for groups of fewer than 10 would be hidden.";
    try{history.replaceState(null,"","#"+cur+(state.region!=="all"?"/"+state.region:""));}catch(e){}}
  $("#tabs").innerHTML=PAGES.map(function(p){return '<button class="tab" role="tab" data-id="'+p.id+'" aria-selected="false">'+p.name+'</button>';}).join("");
  function setTab(id){cur=id;$("#tabs").querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",t.getAttribute("data-id")===id?"true":"false");});}
  $("#tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;setTab(b.getAttribute("data-id"));draw();});
  var rs=$("#region");
  rs.innerHTML='<option value="all">All UK &amp; Ireland</option>'+M.REGIONS.map(function(r){return '<option value="'+r.id+'">'+esc(r.name)+'</option>';}).join("");
  rs.addEventListener("change",function(){state.region=this.value;draw();});
  var ds=$("#dept");
  ds.innerHTML='<option value="all">All departments</option>'+M.DEPTS.map(function(d){return '<option value="'+d.id+'">'+esc(d.name)+'</option>';}).join("");
  ds.addEventListener("change",function(){state.dept=this.value;state.role="all";populateRoles();draw();});
  $("#role").addEventListener("change",function(){state.role=this.value;draw();});
  $("#reset").addEventListener("click",function(){state.region="all";state.dept="all";state.role="all";syncSlicers();draw();});
  (function(){var h=(location.hash||"").replace("#","").split("/");
    if(PAGES.some(function(p){return p.id===h[0];}))cur=h[0];
    if(h[1]&&M.RMAP[h[1]])state.region=h[1];})();
  setTab(cur);syncSlicers();
  var tb=$("#theme");
  function applyTheme(t){document.documentElement.setAttribute("data-theme",t);tb.textContent=t==="dark"?"Light":"Dark";}
  var saved;try{saved=localStorage.getItem("omx-theme");}catch(e){}if(saved)applyTheme(saved);
  tb.addEventListener("click",function(){var c=document.documentElement.getAttribute("data-theme");
    var nx=c==="dark"?"light":(c==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
    applyTheme(nx);try{localStorage.setItem("omx-theme",nx);}catch(e){}});
  var rz,lastW=innerWidth;window.addEventListener("resize",function(){if(innerWidth===lastW)return;lastW=innerWidth;clearTimeout(rz);rz=setTimeout(draw,150);});
  draw();
})();
</script>
